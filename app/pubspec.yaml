name: bnp_scorer
description: BNP Scorer — ball-by-ball cricket scoring for local matches, by BitsNPixs.
publish_to: none
version: 0.9.0-beta.7+8

environment:
  sdk: ^3.8.0
  flutter: ">=3.32.0"

dependencies:
  flutter:
    sdk: flutter
  cricket_engine:
    path: ../packages/cricket_engine
  match_view:
    path: ../packages/match_view
  flutter_riverpod: ^3.0.0
  google_fonts: ^6.2.1
  shared_preferences: ^2.3.0
  share_plus: ^13.3.1
  file_picker: ^13.3.2
  firebase_core: ^5.2.0
  firebase_auth: ^7.1.0
  cloud_firestore: ^7.2.0
  google_sign_in: ^7.2.0
  crypto: ^3.0.6
  qr_flutter: ^4.1.0
  image_picker: ^1.2.4
  flutter_local_notifications: ^23.0.4
  timezone: ^0.11.2
  firebase_messaging: ^17.1.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0

flutter:
  uses-material-design: true
  assets:
    # Inter and Barlow Condensed with their OFL licences (AppFonts.useBundledFonts).
    - assets/google_fonts/
