# Builds the server image in Cloud Build. Run through deploy.sh, which
# uploads a copy holding only the three folders the image needs.
steps:
  - name: gcr.io/cloud-builders/docker
    args: [build, -f, cloud/api/Dockerfile, -t, $_IMAGE, .]
images: [$_IMAGE]
substitutions:
  _IMAGE: asia-south1-docker.pkg.dev/$PROJECT_ID/bnp-api/server:latest
